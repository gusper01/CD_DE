apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-code
  namespace: urban-streaming
data:
  spark_sensor_processor.py: |
    import os
    from pyspark.sql import SparkSession
    from pyspark.sql.functions import (
        avg,
        col,
        from_json,
        to_timestamp,
        window,
    )
    from pyspark.sql.types import (
        DoubleType,
        IntegerType,
        StringType,
        StructField,
        StructType,
    )
    
    KAFKA_BOOTSTRAP_SERVERS = os.getenv("KAFKA_BOOTSTRAP_SERVERS", "kafka:29092")
    KAFKA_TOPIC = os.getenv("KAFKA_TOPIC", "urban_sensors")
    
    schema = StructType([
        StructField("sensor_id", StringType(), False),
        StructField("temperature", DoubleType(), False),
        StructField("humidity", DoubleType(), False),
        StructField("air_quality_index", IntegerType(), False),
        StructField("timestamp", StringType(), False),
    ])
    
    spark = (
        SparkSession.builder
        .appName("UrbanSensorsStreaming")
        .getOrCreate()
    )
    
    spark.sparkContext.setLogLevel("WARN")
    
    raw = (
        spark.readStream
        .format("kafka")
        .option("kafka.bootstrap.servers", KAFKA_BOOTSTRAP_SERVERS)
        .option("subscribe", KAFKA_TOPIC)
        .option("startingOffsets", "latest")
        .load()
    )
    
    parsed = (
        raw.selectExpr("CAST(value AS STRING) AS json_value")
        .select(from_json(col("json_value"), schema).alias("data"))
        .select("data.*")
        .withColumn("event_time", to_timestamp(col("timestamp")))
    )
    
    aggregated = (
        parsed
        .withWatermark("event_time", "1 minute")
        .groupBy(
            window(col("event_time"), "1 minute"),
            col("sensor_id"),
        )
        .agg(
            avg("temperature").alias("avg_temperature"),
            avg("air_quality_index").alias("avg_air_quality_index"),
        )
    )
    
    query = (
        aggregated.writeStream
        .outputMode("update")
        .format("console")
        .option("truncate", "false")
        .option("numRows", 100)
        .start()
    )
    
    query.awaitTermination()
